name: Sync Open Source Contributions

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-open-source.yml"
      - "scripts/sync-open-source.mjs"
      - "scripts/sync-open-source.test.mjs"
      - "scripts/open-source-organizations.json"
      - "data/open-source-contributions.json"
      - "lib/openSourceContributions.ts"
      - "components/opensource/OpenSourceSection.tsx"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: sync-open-source-contributions
  cancel-in-progress: false

jobs:
  sync:
    name: Verify and sync merged upstream PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test contribution normalization and merge logic
        run: npm run test:open-source

      - name: Install portfolio dependencies and validate the app
        if: github.event_name != 'schedule'
        run: npm install --no-package-lock

      - name: Type-check portfolio
        if: github.event_name != 'schedule'
        run: npm run typecheck

      - name: Build portfolio
        if: github.event_name != 'schedule'
        run: npm run build

      - name: Fetch and normalize merged PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:open-source

      - name: Commit only if generated data changed
        run: |
          if git diff --quiet -- data/open-source-contributions.json; then
            echo "Contribution dataset is unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/open-source-contributions.json
          git commit -m "chore(open-source): sync verified merged pull requests"
          git push
